{% extends "base.html" %}
{% block content %}
<section class="page-header">
    <h1>{{ title }}</h1>
</section>

{% if rows %}
<div class="table-wrap">
    <table>
        <thead>
            <tr>
                {% for key in rows[0].keys() %}
                    <th>{{ key.replace("_", " ")|title }}</th>
                {% endfor %}
            </tr>
        </thead>
        <tbody>
            {% for row in rows %}
                <tr>
                    {% for value in row.values() %}
                        <td>{{ value }}</td>
                    {% endfor %}
                </tr>
            {% endfor %}
        </tbody>
    </table>
</div>
{% else %}
<p class="empty">No data found.</p>
{% endif %}
{% endblock %}
