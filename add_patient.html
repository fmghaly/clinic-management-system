{% extends "base.html" %}
{% block content %}
<section class="page-header">
    <h1>Add Patient</h1>
</section>

<form class="form-card" method="post">
    <label>Patient ID <input type="number" name="patient_id" required></label>
    <label>Name <input type="text" name="patient_name" required></label>
    <label>Phone <input type="text" name="phone_number" required></label>
    <label>Address <input type="text" name="address" required></label>
    <label>Birth Date <input type="date" name="birth_date" required></label>
    <label>Job <input type="text" name="job"></label>
    <button type="submit">Add Patient</button>
</form>
{% endblock %}
