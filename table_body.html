{% if rows %}
<div class="table-wrap">
    <table>
        <thead>
            <tr>
                {% for key in rows[0].keys() %}
                    <th>{{ key.replace("_", " ")|title }}</th>
                {% endfor %}
            </tr>
        </thead>
        <tbody>
            {% for row in rows %}
                <tr>
                    {% for value in row.values() %}
                        <td>{{ value }}</td>
                    {% endfor %}
                </tr>
            {% endfor %}
        </tbody>
    </table>
</div>
{% elif patient_name or doctor_name %}
<p class="empty">No appointments matched the search.</p>
{% endif %}
