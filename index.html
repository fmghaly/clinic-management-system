{% extends "base.html" %}
{% block content %}
<section class="page-header">
    <h1>Clinic Management System</h1>
    <p>Database dashboard for departments, clinics, doctors, patients, and appointments.</p>
</section>

<section class="stats-grid">
    {% for label, value in stats.items() %}
        <div class="stat-card">
            <span>{{ label|capitalize }}</span>
            <strong>{{ value }}</strong>
        </div>
    {% endfor %}
</section>
{% endblock %}
